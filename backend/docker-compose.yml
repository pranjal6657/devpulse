services:
  postgres:
    image: postgres:16
    container_name: devpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse_dev
      POSTGRES_DB: devpulse
    ports:
      - "5432:5432"
    volumes:
      - devpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse -d devpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: devpulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  devpulse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devpulse-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://devpulse:devpulse_dev@postgres:5432/devpulse"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: devpulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  devpulse_postgres_data: